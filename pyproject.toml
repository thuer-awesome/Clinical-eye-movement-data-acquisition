[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-capture"
version = "0.7.0"
description = "Windows clinical binocular eye-camera acquisition workstation"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<5",
  "pupil-detectors==2.0.2",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]
qt = ["PySide6>=6.7,<7"]

[tool.setuptools]
packages = ["apps", "apps.clinical_capture", "apps.multicamera_capture"]
