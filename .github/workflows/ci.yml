name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-clinical-capture.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-clinical-capture.txt httpx pypinyin
      - name: Compile Python sources
        run: python -m compileall -q apps scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test*.py" -v

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-clinical-capture.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.venv\Scripts\python.exe -m pip install -r requirements-clinical-capture.txt
      - name: Build portable workstation
        shell: pwsh
        run: .\scripts\build_clinical_capture.ps1 -SkipInstall -PythonPath (Get-Command python).Source
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ClinicalCapture-portable
          path: dist/ClinicalCapture-portable.zip
          if-no-files-found: error
