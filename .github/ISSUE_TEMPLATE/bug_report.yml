name: Bug report
description: Report a reproducible software, hardware-interface, or documentation problem.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, participant data, private patent text, and raw runtime logs before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command, configuration, device, and expected/actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation evidence
      description: Include concise test output or hardware measurements, without sensitive data.
